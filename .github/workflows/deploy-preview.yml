name: Deploy Preview

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    environment:
      name: preview/staging
      url: https://ktherinert-work.github.io/previewTestCHPRAY/

    steps:
      - name: Descargar el repositorio principal
        uses: actions/checkout@v4

      - name: Quitar CNAME de producción
        run: rm -f CNAME
      
      - name: Publicar sitio estático en el repositorio preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PREVIEW_REPO_TOKEN }}
          external_repository: ktherinert-work/previewTestCHPRAY
          publish_branch: gh-pages
          publish_dir: .