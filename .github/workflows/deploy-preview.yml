name: Deploy Preview

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    environment:
      name: preview
      url: https://github.com/ktherinert-work/previewTestCHPRAY

    steps:
      - name: Descargar el repositorio principal
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir la aplicación
        run: npm run build

      - name: Publicar en el repositorio preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PREVIEW_REPO_TOKEN }}
          external_repository: ktherinert-work/previewTestCHPRAY
          publish_branch: gh-pages
          publish_dir: ./dist